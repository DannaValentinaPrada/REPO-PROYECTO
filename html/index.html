<!DOCTYPE html> <!-- Indica que el documento está escrito en HTML5 -->
<html lang="en"> <!-- Define el idioma principal de la página como inglés -->
<head> <!-- Contiene información que no se muestra directamente, como metadatos y títulos -->
    <meta charset="UTF-8"> <!-- Establece la codificación de caracteres UTF-8 para mostrar correctamente el texto -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace que la página se adapte al ancho del dispositivo -->
    <title>Document</title> <!-- Define el título que aparece en la pestaña del navegador -->
</head> <!-- Cierra la sección head -->
<body> <!-- Inicia el contenido visible de la página -->
    <!-- Aquí se agregará el contenido visible de la página -->
</body> <!-- Cierra la sección body -->
</html> <!-- Cierra el documento HTML -->
