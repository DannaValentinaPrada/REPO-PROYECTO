name: Publicar la pagina en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: frontend

      - name: Construir la pagina
        run: npm run build
        working-directory: frontend

      - name: Preparar Pages
        uses: actions/configure-pages@v6

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v5